<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Desconto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculadora">
        <h1>Calculadora de Desconto</h1>
        <p>Digite o valor da compra para calcular o desconto.</p>

        <form onsubmit="calcular(); return false;">
            <label for="compra">Valor da compra (R$)</label>
            <input type="number" id="compra" min="0" step="0.01" placeholder="Ex.: 200,00" required>
            <button type="submit">Calcular desconto</button>
        </form>

        <p id="resultado"></p>
    </main>
    <script src="main.js"></script>
</body>
</html>
